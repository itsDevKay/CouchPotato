<html>
    <title>BrowserTorrent</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
        <style>
            body {
                overflow-wrap: anywhere;
            }
            .item {
                justify-content: space-between;
            }
            .item:hover {
                background-color: #262626;
            }
            .loader {
                margin: auto;
                border: 2px solid #eaf0f6c9;
                border-radius: 50%;
                border-top: 2px solid #d28c41;
                width: 25px;
                height: 25px;
                animation: spinner 0.5s linear infinite;
            }

            @keyframes spinner {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            video { width: 100%; }
        </style>
        <script>
        // $(function() {
            let options = {
                root: document.querySelector(".item-container"),
                rootMargin: "0px",
                threshold: 1, //visibility threshold
            };

            let callback = (entries, observer) => {
                entries.forEach((entry) => {
                    console.log(entry);
                    // Each entry describes an intersection change for one observed
                    // target element:
                    //   entry.boundingClientRect
                    //   entry.intersectionRatio
                    //   entry.intersectionRect
                    //   entry.isIntersecting
                    //   entry.rootBounds
                    //   entry.target
                    //   entry.time
                    if (entry.isIntersecting) {
                        let elem = entry.target;

                        if (entry.intersectionRatio >= 0.75) {
                            intersectionCounter++;
                            fetchMovies();
                        }
                    }
                });
            };

            let observer = new IntersectionObserver(callback, options);
            let intersectionCounter = 1;
            let currentTarget, previousTarget;



            async function fetchMovies() {
                fetch(`/api/movies/${intersectionCounter}`)
                .then(response => response.json())
                .then(data => {
                    let itemContainer = document.querySelector('.item-container');
                    data.results.forEach((item, idx) => {
                        // console.log((idx+1)*intersectionCounter);
                        let iContainer = document.createElement('div');
                        iContainer.style.padding = '10px';
                        iContainer.id = `movieitem-${(idx+1)+(intersectionCounter*19)}`;
                        
                        let i = document.createElement('div');
                        i.classList.add('movie-item');
                        i.setAttribute('data-original-title', item.original_title);
                        i.setAttribute(
                            'style', 
                            `background-image:url("https://images.tmdb.org/t/p/original${item.poster_path}");height:240px; width:120px;padding-right:10px;padding-bottom:10px;border-radius: 15px;box-shadow: 0 2px 15px 2px #201f1f9e;background-size: cover;background-position: center;background-repeat: no-repeat;cursor:pointer;`
                        );
                        i.onclick = (() => {
                            $('.loader').show();
                            $('.torrent-display').show();
                            fetch(
                                'http://localhost:8111/api/searchtorrent/' + item.original_title
                            )
                            .then(r => r.json())
                            .then(torrent => {
                                $('.loader').hide();
                                for (let i=0; i < torrent.torrents.length; i++) {
                                    if (document.querySelector('.results-container').children.length == 0) {
                                        for (let i=0; i < document.querySelector('.results-container').children.length; i++) {
                                            document.querySelector('.results-container').children[i].remove();
                                        }
                                    }
                                    createResultItem(
                                        torrent.torrents[i].torrent.title, 
                                        torrent.torrents[i].torrent.seeds,
                                        torrent.torrents[i].magnet
                                    );
                                }

                                // window.infoHash = torrent.torrents[0].magnet.split('btih:')[1].split('&')[0];
                                // $.get(api + 'api/add/' + infoHash, function(data) {
                                //     var video = api + 'stream/' + infoHash + '.mp4';
                                //     $('video').attr('src', video);
                                //     $('.input').hide();
                                //     $('.video').show();
                                // });
                            });
                        })

                        itemContainer.appendChild(iContainer);
                        iContainer.appendChild(i);
                    });

                    previousTarget = currentTarget;
                    currentTarget = document.querySelector(`#movieitem-${(10+1)+(intersectionCounter*19)}`);
                    observer.unobserve(previousTarget);
                    observer.observe(currentTarget);
                })
            }
            
            // load movies
            fetch('/api/movies')
            .then(response => response.json())
            .then(data => {
                let itemContainer = document.querySelector('.item-container');
                data.results.forEach((item, idx) => {
                    let iContainer = document.createElement('div');
                    iContainer.style.padding = '10px';
                    iContainer.id = `movieitem-${idx}`;
                    
                    let i = document.createElement('div');
                    i.classList.add('movie-item');
                    i.setAttribute('data-original-title', item.original_title);
                    i.setAttribute(
                        'style', 
                        `background-image:url("https://images.tmdb.org/t/p/original${item.poster_path}");height:240px; width:120px;padding-right:10px;padding-bottom:10px;border-radius: 15px;box-shadow: 0 2px 15px 2px #201f1f9e;background-size: cover;background-position: center;background-repeat: no-repeat;cursor:pointer;`
                    );
                    i.onclick = (() => {
                        $('.loader').show();
                        $('.torrent-display').show();
                        fetch(
                            'http://localhost:8111/api/searchtorrent/' + item.original_title
                        )
                        .then(r => r.json())
                        .then(torrent => {
                            $('.loader').hide();
                            for (let i=0; i < torrent.torrents.length; i++) {
                                if (document.querySelector('.results-container').children.length == 0) {
                                    for (let i=0; i < document.querySelector('.results-container').children.length; i++) {
                                        document.querySelector('.results-container').children[i].remove();
                                    }
                                }
                                createResultItem(
                                    torrent.torrents[i].torrent.title, 
                                    torrent.torrents[i].torrent.seeds,
                                    torrent.torrents[i].magnet
                                );
                            }

                            // window.infoHash = torrent.torrents[0].magnet.split('btih:')[1].split('&')[0];
                            // $.get(api + 'api/add/' + infoHash, function(data) {
                            //     var video = api + 'stream/' + infoHash + '.mp4';
                            //     $('video').attr('src', video);
                            //     $('.input').hide();
                            //     $('.video').show();
                            // });
                        });
                    })

                    itemContainer.appendChild(iContainer);
                    iContainer.appendChild(i);
                });

                currentTarget = document.querySelector(`#movieitem-${10*intersectionCounter}`);
                observer.observe(currentTarget);
            });

            var api = 'http://localhost:8111/';
            $('.stream').click(function() {
                window.infoHash = $('input').val().split('btih:')[1].split('&')[0];
                $.get(api + 'api/add/' + infoHash, function(data) {
                    var video = api + 'stream/' + infoHash + '.mp4';
                    $('video').attr('src', video);
                    $('.input').hide();
                    $('.video').show();
                });
            });
            $('.stop').click(function() {
                $.get(api + 'api/delete/' + infoHash, function(data) {
                    $('video').attr('src', '');
                    $('input').val('');
                    window.infoHash = '';
                    $('.input').show();
                    $('.video').hide();
                });
            });

            const createResultItem = (title, seeds, magnet) => {
                // <div class="item" style="border-bottom: 1px solid #f1f1f1; height: 65px; width: 100%;">
                let item = document.createElement('div');
                    item.classList.add('item');
                    item.style.borderBottom = '1px solid #f1f1f1';
                    item.style.height = '65px';
                    item.style.cursor = 'pointer';
                    item.style.width = '100%';
                    item.style.display = 'flex';
                    item.style.alignItems = 'center';
                    item.style.justifyContent = 'justify-between';
                    item.style.color = '#f1f1f1';
                    item.style.padding = '0 5px';
                    item.setAttribute('data-magnet', magnet);
                    item.onclick = (() => {
                        window.infoHash = magnet.split('btih:')[1].split('&')[0];
                        $.get(api + 'api/add/' + infoHash, function(data) {
                            var video = api + 'stream/' + infoHash + '.mp4';
                            $('video').attr('src', video);
                            $('.input').hide();
                            $('.video').show();
                            $('.torrent-display').hide();
                        });
                    });

                let _title = document.createElement('p');
                _title.textContent = title;
                _title.style.width = '75%';
                _title.style.overflowWrap = 'anywhere';
                
                let seedDiv = document.createElement('div');
                seedDiv.style.color = '#f1f1f1';
                seedDiv.style.display = 'flex';
                seedDiv.style.alignItems = 'center';

                let _seedCount = document.createElement('p');
                _seedCount.textContent = `Seeds: ${seeds}`;
                _seedCount.style.paddingRight = '5px';

                let _seedIcon = document.createElement('div');

                // if height and widht has to be changed otherwise you put them directly in svg_str
                const h = 23 + 'px';
                const w = 23 + 'px';
                const fill = seeds >= 100 ? 'green' : (
                    seeds < 50 ? 'red' : 'orange'
                );
                // if path is a variable otherwise you put directly in svg_str
                const path_d = "M4,14H2V2H4ZM7,5H5v9H7Zm3,3H8v6h2Zm3,3H11v3h2Z";

                svg_str = '<svg xmlns="http://www.w3.org/2000/svg" fill="' + fill + '" width="' + w + '" height="' + h + '"><path d="' + path_d + '"/></svg>';
                    
                document.querySelector('.results-container').appendChild(item);

                item.appendChild(_title);
                item.appendChild(seedDiv);

                seedDiv.appendChild(_seedCount);
                seedDiv.appendChild(_seedIcon);

                _seedIcon.innerHTML = svg_str;
            }

            $('.search').click(() => {
                $('.loader').show();
                $('.torrent-display').show();
                fetch(
                    'http://localhost:8111/api/searchtorrent/' + $('#q').val()
                )
                .then(r => r.json())
                .then(torrent => {
                    $('.loader').hide();
                    for (let i=0; i < torrent.torrents.length; i++) {
                        if (document.querySelector('.results-container').children.length == 0) {
                            for (let i=0; i < document.querySelector('.results-container').children.length; i++) {
                                document.querySelector('.results-container').children[i].remove();
                            }
                        }
                        createResultItem(
                            torrent.torrents[i].torrent.title, 
                            torrent.torrents[i].torrent.seeds,
                            torrent.torrents[i].magnet
                        );
                    }

                    // window.infoHash = torrent.torrents[0].magnet.split('btih:')[1].split('&')[0];
                    // $.get(api + 'api/add/' + infoHash, function(data) {
                    //     var video = api + 'stream/' + infoHash + '.mp4';
                    //     $('video').attr('src', video);
                    //     $('.input').hide();
                    //     $('.video').show();
                    // });
                });
            })
        // });
        </script>
    </head>
    <body>
        <div class="container">
            <h1>BrowserTorrent</h1>
            <div class="video" style="display:none">
                <video width="640" height="360" autoplay preload controls type="video/mp4" src="" style="background:black"></video>
                <br>
                <button class="stop">Stop</button>
            </div>

            <div class="torrent-display" style="display: none; padding: 5px 15px;background: #333; border: 4px solid #d28c41;height: 80%;width: 80%;position: fixed;left: 50%;right: 50%;top: 50%;bottom: 50%;transform: translateX(-50%) translateY(-50%);box-shadow: 0 2px 15px 5px rgba(0,0,0,0.2);">
                <h2 style="color: #f1f1f1;">Torrents</h2>
                <div class="results-container" style="overflow-y:scroll; height: 85%; overflow-x:hidden;">
                    <div class="loader" style="display: none;"></div>
                </div>
            </div>
